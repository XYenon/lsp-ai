[package]
name = "lsp-ai"
version = "0.7.1"

description.workspace = true
repository.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.100"
lsp-server = "0.7.9"
lsp-types = "0.95.1"
ropey = "1.6.1"
serde = "1.0.228"
serde_json = "1.0.148"
hf-hub = { git = "https://github.com/huggingface/hf-hub", version = "0.4.3" }
rand = "0.8.5"
tokenizers = "0.14.1"
parking_lot = "0.12.5"
once_cell = "1.21.3"
directories = "5.0.1"
llama-cpp-2 = { version = "0.1.64", optional = true }
minijinja = { version = "1.0.22", features = ["loader"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing = "0.1.44"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
reqwest = { version = "0.11.27", features = ["blocking", "json"] }
ignore = "0.4.25"
pgml = "1.1.1"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time"] }
indexmap = "2.12.1"
async-trait = "0.1.89"
tree-sitter = "0.22"
utils-tree-sitter = { path = "../utils-tree-sitter", features = ["all"], version = "0.1.0" }
splitter-tree-sitter = { path = "../splitter-tree-sitter", version = "0.1.0" }
text-splitter = { version = "0.13.3" }
simsimd = { version = "4.4.0", optional = true }
rayon = { version = "1.11.0", optional = true }
md5 = "0.7.0"
fxhash = "0.2.1"
ordered-float = "4.6.0"
futures = "0.3.31"
clap = { version = "4.5.53", features = ["derive"] }
regex = "1.12.2"

[build-dependencies]
cc = "1"

[features]
default = ["simsimd", "rayon"]
rayon = ["dep:rayon", "indexmap/rayon"]
simsimd = ["dep:simsimd"]
llama_cpp = ["dep:llama-cpp-2"]
metal = ["llama-cpp-2/metal"]
cuda = ["llama-cpp-2/cuda"]
stress_test = []

[dev-dependencies]
assert_cmd = "2.1.1"
